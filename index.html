// ─── Voice + Feedback Helpers ───
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceRecognition=null;

function speakText(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US";
  utterance.rate = 1;
  utterance.pitch = 1;
  window.speechSynthesis.speak(utterance);
}

function startDictation(onResult, onError){
  if(!SpeechRecognition){onError?.("Voice dictation not supported in this browser.");return;}
  stopDictation();
  voiceRecognition = new SpeechRecognition();
  voiceRecognition.lang = "en-US";
  voiceRecognition.interimResults = false;
  voiceRecognition.maxAlternatives = 1;
  voiceRecognition.onresult = (e)=>{ onResult(e.results[0][0].transcript); };
  voiceRecognition.onerror = (e)=>{ onError?.(e.error || e.message || "Dictation error"); };
  voiceRecognition.onend = ()=>{ voiceRecognition = null; };
  voiceRecognition.start();
}

function stopDictation(){ if(voiceRecognition){ voiceRecognition.stop(); voiceRecognition = null; } }

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  const ta=document.createElement("textarea");
  ta.value=text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
  return Promise.resolve();
}

function buildClaudePrompt({question, answer="", category="", resume="", mode="feedback"}){
  const role = mode==="sample"
    ? "You are a senior PM interview coach. Write a strong sample answer."
    : "You are a senior PM interview coach. Provide direct, constructive feedback.";
  const resumeBlock = resume ? `Candidate resume:\n${resume}\n\n` : "";
  return `${role}\n\nCategory: ${category}\nQuestion: ${question}\n${resumeBlock}Candidate answer:\n${answer || "(not provided)"}\n\nInstructions:\n1. Give an overall rating out of 5.\n2. List strengths and areas for improvement.\n3. Comment on structure, metrics, clarity, and storytelling.\n4. Offer a rewritten answer example if mode is sample.\n5. Keep feedback concise and actionable.`;
}

function evaluateAnswer(answer, question, category){
  const text = (answer||"").trim();
  const wc = wordCount(text);
  const baseScore = Math.min(30, Math.floor(Math.min(wc,250)/5));
  const starParts = ["situation","task","action","result"].map(term=>new RegExp(`\\b${term}\\b`, "i").test(text));
  const starScore = (starParts.filter(Boolean).length / 4) * 40;
  const metricScore = /\b\d+%?|\d+\s+(days|weeks|months|users|customers|revenue|growth|dollars)\b/i.test(text) ? 20 : 0;
  const actionScore = /\b(led|owned|launched|built|delivered|improved|reduced|increased|defined|prioritized|aligned|mentored|scaled|measured)\b/i.test(text) ? 10 : 0;
  const score = Math.min(100, baseScore + starScore + metricScore + actionScore);

  const structure = starParts.filter(Boolean).length >= 3 ? "Clear STAR structure" : "Needs stronger STAR structure";
  const specifics = metricScore ? "Includes measurable details" : "Add metrics or outcomes";
  const clarity = wc >= 80 ? "Substantial answer length" : "Answer is short; add more detail";
  const tone = /\bI\b/.test(text) ? "Personal and owned" : "Make examples feel more personal";

  const recommendations = [];
  if(!starParts[0] && !starParts[1]) recommendations.push("Open with the situation and goal.");
  if(!starParts[2]) recommendations.push("Describe the actions you took.");
  if(!starParts[3]) recommendations.push("Close with the result and impact.");
  if(!metricScore) recommendations.push("Include a concrete metric or measurable outcome.");
  if(wc < 80) recommendations.push("Add 1-2 concrete examples or outcomes.");
  if(score < 55) recommendations.push("Tell a more specific story with numbers and decisions.");

  return {
    score,
    rating: score >= 80 ? "Strong" : score >= 60 ? "Solid" : "Needs work",
    wordCount: wc,
    structure,
    specifics,
    clarity,
    tone,
    recommendations,
  };
}

// ─── PDF extraction ───
async function extractPDF(file){
  return new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    script.onload=async()=>{
      try{
        pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        const buf=await file.arrayBuffer();
        const pdf=await pdfjsLib.getDocument({data:buf}).promise;
        let text="";
        for(let i=1;i<=pdf.numPages;i++){
          const pg=await pdf.getPage(i);
          const c=await pg.getTextContent();
          text+=c.items.map(x=>x.str).join(" ")+"\n\n";
        }
        resolve(text.trim());
      }catch(e){reject(e)}
    };
    script.onerror=()=>reject(new Error("Could not load PDF reader"));
    document.head.appendChild(script);
  });
}

           <div style="color:var(--accent);font-size:12px;font-weight:700;margin-top:12px">Tap to upload a different resume</div>`
        :`<div style="font-size:40px;margin-bottom:10px">📄</div>

           <div style="color:var(--tx2);font-size:12px;margin-top:4px">Tap to select a PDF or text file</div>`}
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;margin:0 16px 16px">
    <div style="flex:1;height:1px;background:rgba(255,255,255,.08)"></div>

  </div>
  <div style="padding:0 16px 120px">

    <div style="display:flex;gap:10px;margin-top:14px">

      Saved locally on this device · Powers all AI features<br/>Upload a new resume anytime to update

  const zone=document.getElementById("upzone");
  const inp=document.getElementById("fileinput");

    const status=document.getElementById("upstatus");

    try{

        text=await file.text();
      }
      profile=text;fileName=file.name;saveProfile();
      showToast("✓ Resume uploaded & saved!");
      renderProfile(c);
    }catch(err){
      showToast("Error reading file. Try pasting text instead.");
      console.error(err);
      renderProfile(c);
    }
  };

  const ta=document.getElementById("profiletext");
  ta.oninput=()=>{profile=ta.value;fileName=""};

  document.getElementById("savebtn").onclick=()=>{
    if(!profile)return;
    saveProfile();showToast("✓ Profile saved!");renderProfile(c);
  };

  const cb=document.getElementById("clearbtn");
  if(cb)cb.onclick=()=>{profile="";fileName="";saveProfile();showToast("Profile cleared");renderProfile(c)};
}

// ═══════════════════════════════════════
// ELEVATOR PITCH
// ═══════════════════════════════════════
function renderPitch(c){
  let dur=120,left=120,running=false,pitchText="";

  function draw(){
    const pct=((dur-left)/dur)*100;
    const sec=Math.min(Math.floor((pct/100)*PITCH_STEPS.length),PITCH_STEPS.length-1);
    const wc=wordCount(pitchText);

    c.innerHTML=`
    <div class="hdr"><h1>🎤 Elevator Pitch</h1><p>Practice both your elevator pitch and "Tell me about yourself" response.</p></div>
    ${!profile?warnHTML():""}
    <div style="padding:0 16px 10px;display:flex;gap:8px">
      ${[60,90,120].map(d=>`<button class="chip ${dur===d?"on":""}" data-dur="${d}">${d===60?"1 min":d===90?"1.5 min":"2 min"}</button>`).join("")}
    </div>
    <div class="card" style="background:linear-gradient(145deg,#141424,#0B0B14);text-align:center;position:relative;overflow:hidden">
      <div style="position:absolute;bottom:0;left:0;height:3px;background:var(--accent);width:${pct}%;transition:width 1s linear;border-radius:2px"></div>
      <div class="timer-num ${left<=10&&left>0?"red":""}">${fmt(left)}</div>
      ${running?`<div style="color:var(--accent);font-size:12px;font-weight:600;margin-top:6px;padding:0 10px">${PITCH_STEPS[sec].icon} <strong>${PITCH_STEPS[sec].label}</strong> — ${PITCH_STEPS[sec].tip}</div>`:""}
      <div style="display:flex;justify-content:center;gap:10px;margin-top:16px">
        ${!running
          ?`<button class="btn bp" id="startbtn">▶ Start</button>`
          :`<button class="btn" style="background:var(--amber);color:#0B0B14" id="pausebtn">⏸ Pause</button>`}
        <button class="btn bs" id="resetbtn">↺ Reset</button>
      </div>
    </div>
    <div style="padding:8px 16px">
      <h3 style="font-family:'Fraunces',serif;font-size:17px;margin-bottom:10px">Pitch Structure</h3>
      ${PITCH_STEPS.map((s,i)=>`
        <div style="background:var(--s1);border:1px solid ${running&&sec===i?"var(--accent)":"rgba(255,255,255,.05)"};border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;${running&&sec===i?"background:rgba(240,98,80,.06)":""}">
          <div style="min-width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:${running&&sec===i?"var(--accent)":"var(--s2)"};color:${running&&sec===i?"#fff":"var(--tx2)"}">${i+1}</div>
          <div>
            <div style="font-weight:700;font-size:13px">${s.icon} ${s.label} <span style="font-weight:400;color:var(--tx3)">(${s.time})</span></div>
            <div style="font-size:12px;color:var(--tx2);margin-top:2px">${s.tip}</div>
          </div>
        </div>`).join("")}
    </div>
    <div style="padding:4px 16px">
      <button class="btn bp" style="width:100%;font-size:12px;padding:10px 16px;border-radius:10px" id="promptPitch">📋 Copy Claude Pro prompt</button>
      <div style="color:var(--tx3);font-size:12px;margin-top:10px;line-height:1.5">Copy this prompt to Claude Pro to get targeted feedback or a refined pitch. No API key required.</div>
    </div>
    <div style="padding:12px 16px 110px">
      <h3 style="font-family:'Fraunces',serif;font-size:17px;margin-bottom:10px">Your Draft</h3>
      <textarea class="ta" id="pitchta" style="min-height:160px" placeholder="Write your pitch here...">${pitchText}</textarea>
      <div style="color:var(--tx3);font-size:11px;margin-top:6px">${wc} words · ~${Math.ceil(wc/2.5)}s at average pace</div>
    </div>`;

    document.querySelectorAll("[data-dur]").forEach(b=>b.onclick=()=>{
      dur=parseInt(b.dataset.dur);left=dur;running=false;clearInterval(timerInterval);draw();
    });

    const sb=document.getElementById("startbtn");
    if(sb)sb.onclick=()=>{left=dur;running=true;clearInterval(timerInterval);timerInterval=setInterval(()=>{left--;if(left<=0){clearInterval(timerInterval);running=false}draw()},1000);draw()};

    const pb=document.getElementById("pausebtn");
    if(pb)pb.onclick=()=>{running=false;clearInterval(timerInterval);draw()};

    document.getElementById("resetbtn").onclick=()=>{running=false;left=dur;clearInterval(timerInterval);draw()};

    const ta=document.getElementById("pitchta");
    ta.oninput=()=>{pitchText=ta.value};

    const pp=document.getElementById("promptPitch");
    if(pp)pp.onclick=()=>{
      const prompt = buildClaudePrompt({
        question: "Elevator pitch / Tell me about yourself",
        answer: pitchText,
        category: "Pitch",
        resume: profile,
        mode: "feedback"
      });
      copyToClipboard(prompt).then(()=>showToast("Prompt copied to clipboard"));
    };
  }
  draw();
}

// ═══════════════════════════════════════
// Q&A PANEL
// ═══════════════════════════════════════
function renderQA(c,category){
  const qs=QUESTIONS[category]||[];
  const color=COLORS[category]||"#5B8DEF";
  const tab=TABS.find(t=>t.id===category);
  let openQ=-1;

  function draw(){
    c.innerHTML=`
    <div class="hdr"><h1>${tab.icon} ${tab.label}</h1><p>Tap a question to practice</p></div>
    ${profile?`<div class="green-badge">✓ Answers personalized to your resume</div>`:warnHTML()}
    <div style="padding:0 16px 110px" id="qlist"></div>`;

    const list=document.getElementById("qlist");
    qs.forEach((q,i)=>{
      // Question button
      const qi=el("div","qi"+(openQ===i?" on":""));
      qi.innerHTML=`<div class="qn" style="background:${color}">${i+1}</div><div class="qt">${q}</div>`;
      qi.onclick=()=>{openQ=openQ===i?-1:i;draw()};
      list.appendChild(qi);

      // Answer panel
      if(openQ===i){
        const ap=el("div","ap");
        ap.style.animation="fadeUp .3s ease both";
        ap.innerHTML=`
          <div style="font-size:11px;font-weight:800;color:var(--tx3);letter-spacing:.5px;margin-bottom:8px">YOUR ANSWER</div>
          <textarea class="ta" id="userans" placeholder="Practice your answer... Use STAR: Situation → Task → Action → Result"></textarea>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
            <button class="btn bs" style="font-size:12px;padding:8px 16px;border-radius:9px" id="speakq">🔊 Read question</button>
            <button class="btn bs" style="font-size:12px;padding:8px 16px;border-radius:9px" id="dictate">🎙️ Dictate answer</button>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
            <button class="btn bp" style="font-size:12px;padding:8px 16px;border-radius:9px" id="evalans">🧠 Evaluate answer</button>
            <button class="btn bs" style="font-size:12px;padding:8px 16px;border-radius:9px" id="copyprompt">📋 Copy Claude Pro prompt</button>
          </div>
          <div id="feedbackbox"></div>
          <div style="margin-top:12px;font-size:12px;color:var(--tx3)">Use the prompt button with Claude Pro for advanced review and improvement suggestions.</div>`;
        list.appendChild(ap);

        const ta=document.getElementById("userans");
        ta.oninput=()=>{};

        document.getElementById("speakq").onclick=()=>{ speakText(q); };
        document.getElementById("dictate").onclick=()=>{
          startDictation(text=>{ ta.value = text; showToast("Dictation captured."); }, err=>{ showToast(err); });
        };
        document.getElementById("evalans").onclick=()=>{
          const feedback = evaluateAnswer(ta.value, q, tab.label);
          document.getElementById("feedbackbox").innerHTML = renderFeedbackSummary(feedback);
        };
        document.getElementById("copyprompt").onclick=()=>{
          const prompt = buildClaudePrompt({
            question: q,
            answer: ta.value,
            category: tab.label,
            resume: profile,
            mode: "feedback"
          });
          copyToClipboard(prompt).then(()=>showToast("Claude Pro prompt copied"));
        };
      }
    });
  }
  draw();
}

// ═══════════════════════════════════════
// MOCK INTERVIEW
// ═══════════════════════════════════════
function renderMock(c){
  if(!mockState.step)mockState={step:"setup",cats:["behavioral","strategy"],num:3,qs:[],cur:0,answers:{},curAns:"",timer:0,fb:""};

  function drawSetup(){
    const cats=mockState.cats;const num=mockState.num;
    c.innerHTML=`
    <div class="hdr"><h1>🎯 Mock Interview</h1><p>Simulate a real PM interview panel</p></div>
    <div style="padding:0 16px 110px">
      ${profile?`<div class="green-badge">✓ Feedback personalized to your resume</div>`:warnHTML()}
      <div style="font-size:12px;font-weight:800;color:var(--tx3);letter-spacing:.5px;margin-bottom:10px">CATEGORIES</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px" id="catpicks"></div>
      <div style="font-size:12px;font-weight:800;color:var(--tx3);letter-spacing:.5px;margin-bottom:10px">NUMBER OF QUESTIONS</div>
      <div style="display:flex;gap:8px;margin-bottom:28px" id="numpicks"></div>
      <button class="btn bp" style="width:100%;padding:16px;font-size:16px" id="startmock" ${cats.length===0?"disabled":""}>🎯 Start Mock Interview</button>
      <div style="color:var(--tx3);font-size:11px;text-align:center;margin-top:10px">Randomized · Timed · Honest panel-grade feedback</div>
    </div>`;

    const catBox=document.getElementById("catpicks");
    ["behavioral","strategy","improve","design","metrics","execution"].forEach(cat=>{
      const t=TABS.find(x=>x.id===cat);
      const on=cats.includes(cat);
      const b=el("button","chip"+(on?" on":""));
      b.textContent=t.icon+" "+t.label;
      if(on)b.style.cssText=`border-color:${COLORS[cat]};color:${COLORS[cat]};background:${COLORS[cat]}18`;
      b.onclick=()=>{
        if(cats.includes(cat))mockState.cats=cats.filter(x=>x!==cat);
        else mockState.cats=[...cats,cat];
        drawSetup();
      };
      catBox.appendChild(b);
    });

    const numBox=document.getElementById("numpicks");
    [3,5,7].forEach(n=>{
      const b=el("button","chip"+(num===n?" on":""));
      b.textContent=n+" questions";
      b.onclick=()=>{mockState.num=n;drawSetup()};
      numBox.appendChild(b);
    });

    document.getElementById("startmock").onclick=()=>{
      const pool=[];
      mockState.cats.forEach(cat=>(QUESTIONS[cat]||[]).forEach(q=>pool.push({category:cat,question:q})));
      mockState.qs=pool.sort(()=>Math.random()-.5).slice(0,mockState.num);
      mockState.cur=0;mockState.answers={};mockState.curAns="";mockState.timer=0;mockState.fb="";
      mockState.step="go";
      timerInterval=setInterval(()=>mockState.timer++,1000);
      drawInterview();
    };
  }

  function drawInterview(){
    const{qs,cur,curAns,timer}=mockState;
    const q=qs[cur];const color=COLORS[q.category]||"#5B8DEF";const t=TABS.find(x=>x.id===q.category);

    c.innerHTML=`
    <div style="padding:16px 16px 8px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:12px;font-weight:700;color:var(--tx3)">Question ${cur+1} of ${qs.length}</div>
      <div style="padding:5px 14px;background:var(--s1);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700">⏱ ${fmt(timer)}</div>
    </div>
    <div style="padding:0 16px 6px"><div style="height:4px;background:var(--s2);border-radius:2px;overflow:hidden"><div style="height:4px;border-radius:2px;background:${color};width:${(cur/qs.length)*100}%;transition:width .4s"></div></div></div>
    <div style="padding:10px 16px 110px">
      <div class="chip on" style="border-color:${color};color:${color};background:${color}18;margin-bottom:14px">${t.icon} ${t.label}</div>
      <h2 style="font-family:'Fraunces',serif;font-size:20px;line-height:1.45;margin-bottom:18px">${q.question}</h2>
      <textarea class="ta" id="mockans" style="min-height:200px" placeholder="Type your answer... Be specific with examples and metrics.">${curAns}</textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
        <button class="btn bs" style="font-size:12px;padding:8px 16px;border-radius:9px" id="mockSpeak">🔊 Read question</button>
        <button class="btn bs" style="font-size:12px;padding:8px 16px;border-radius:9px" id="mockDictate">🎙️ Dictate answer</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
        <span style="color:var(--tx3);font-size:11px">${wordCount(curAns)} words</span>
        <button class="btn bp" id="submitans">${cur<qs.length-1?"Next Question →":"Submit & Get Feedback"}</button>
      </div>
    </div>`;

    const ta=document.getElementById("mockans");
    ta.focus();
    ta.oninput=()=>{mockState.curAns=ta.value};
    document.getElementById("mockSpeak").onclick=()=>{ speakText(q.question); };
    document.getElementById("mockDictate").onclick=()=>{
      startDictation(text=>{ mockState.curAns = text; ta.value = text; showToast("Dictation captured."); }, err=>{ showToast(err); });
    };

    document.getElementById("submitans").onclick=()=>{
      mockState.answers[cur]=mockState.curAns;mockState.curAns="";
      if(cur<qs.length-1){mockState.cur++;drawInterview()}
      else{clearInterval(timerInterval);mockState.step="fb";drawFeedback()}
    };
  }

  async function drawFeedback(){
    const{qs,answers,timer}=mockState;
    const evals = qs.map((q,i)=>{
      const answer = answers[i]||"";
      return { q, answer, feedback: evaluateAnswer(answer, q.question, q.category) };
    });
    const avgScore = Math.round(evals.reduce((sum,item)=>sum+item.feedback.score,0)/Math.max(evals.length,1));
    const verdict = avgScore >= 80 ? "Strong Hire" : avgScore >= 65 ? "Hire" : avgScore >= 50 ? "Lean Hire" : "Not Yet Ready";
    const overallNotes = avgScore >= 80 ? "Great structure and clarity overall." : avgScore >= 65 ? "Good responses with room for stronger metrics." : "Focus on STAR storytelling and measurable outcomes.";

    const qaPrompt = qs.map((q,i)=>`Q${i+1} [${q.category}]: ${q.question}\nAnswer: ${answers[i]||"(No answer)"}`).join("\n\n");
    const copyPrompt = `You are a senior PM interview coach. Provide a mock interview debrief for this candidate.\n\n${profile?`Candidate resume:\n${profile}\n\n`:"No resume provided.\n\n"}Questions & answers:\n${qaPrompt}\n\nTime: ${fmt(timer)}\n\nProvide:\n1. OVERALL RATING out of 5 and verdict.\n2. Strengths.\n3. Areas for improvement.\n4. Per-question score and improvement notes.\n5. Communication style feedback.\n6. Top 3 action items.`;

    c.innerHTML=`
    <div class="hdr"><h1>📋 Panel Debrief</h1><p>${fmt(timer)} · ${qs.length} questions</p></div>
    <div style="padding:0 16px 110px">
      <div class="card" style="margin-bottom:16px;padding:18px;">
        <div style="font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.08em;margin-bottom:8px">LOCAL FEEDBACK SUMMARY</div>
        <div style="font-size:18px;font-weight:800;margin-bottom:6px">${verdict}</div>
        <div style="color:var(--tx3);font-size:13px;line-height:1.6">${overallNotes} Average score: ${avgScore}%.</div>
      </div>
      <button class="btn bp" style="width:100%;font-size:14px;padding:14px;margin-bottom:16px" id="copyMockPrompt">📋 Copy Claude Pro mock debrief prompt</button>
      ${evals.map((item,i)=>`<div class="card" style="margin-bottom:10px;">
        <div style="font-size:10px;font-weight:800;color:${COLORS[item.q.category]||"#5B8DEF"};text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">${TABS.find(t=>t.id===item.q.category)?.icon||""} ${item.q.category}</div>
        <div style="font-size:13px;font-weight:700;margin-bottom:8px">${item.q.question}</div>
        <div style="font-size:12px;color:var(--tx2);line-height:1.7;white-space:pre-wrap;margin-bottom:10px">${item.answer||"(No answer)"}</div>
        ${renderFeedbackSummary(item.feedback)}
      </div>`).join("")}
      <button class="btn bp" style="width:100%;margin-top:10px" id="newmock">↺ Start New Mock Interview</button>
    </div>`;

    document.getElementById("copyMockPrompt").onclick=()=>{
      copyToClipboard(copyPrompt).then(()=>showToast("Mock interview prompt copied"));
    };
    document.getElementById("newmock").onclick=()=>{mockState={step:"setup",cats:["behavioral","strategy"],num:3};renderMock(c)};
  }

  if(mockState.step==="setup")drawSetup();
  else if(mockState.step==="go")drawInterview();
  else if(mockState.step==="fb"&&mockState.fb){
    // Re-render existing feedback
    const{qs,answers,timer,fb}=mockState;
    c.innerHTML=`
    <div class="hdr"><h1>📋 Panel Debrief</h1><p>${fmt(timer)} · ${qs.length} questions</p></div>
    <div style="padding:0 16px 110px">
      <div class="card" style="white-space:pre-wrap;font-size:13px;line-height:1.85">${fb}</div>
      <button class="btn bp" style="width:100%;margin-top:10px" id="newmock">↺ Start New Mock Interview</button>
    </div>`;
    document.getElementById("newmock").onclick=()=>{mockState={step:"setup",cats:["behavioral","strategy"],num:3};renderMock(c)};
  }
  else drawFeedback();
}
