<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Interactive PM Interview</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PM Interview"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0B0B14"/>
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxODAgMTgwIj48cmVjdCB3aWR0aD0iMTgwIiBoZWlnaHQ9IjE4MCIgcng9IjQwIiBmaWxsPSIjMEIwQjE0Ii8+PHRleHQgeD0iOTAiIHk9IjExNSIgZm9udC1zaXplPSI4MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI0YwNjI1MCIgZm9udC1mYW1pbHk9InNlcmlmIiBmb250LXdlaWdodD0iYm9sZCI+UE08L3RleHQ+PC9zdmc+"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0B0B14;--s1:#141424;--s2:#1C1C34;--tx:#EEEEF6;--tx2:#A0A0C0;--tx3:#606088;--accent:#F06250;--green:#3DD68C;--amber:#FBC94A;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Outfit',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:0}
textarea,input{font-family:inherit;-webkit-appearance:none;border:none}
textarea:focus,input:focus{outline:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.content{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:var(--st);padding-bottom:var(--sb)}
.page{display:none;animation:fadeUp .3s ease both}
.page.active{display:block}
.hdr{padding:20px 16px 12px;background:linear-gradient(180deg,rgba(240,98,80,.08) 0%,transparent 100%)}
.hdr h1{font-family:'Fraunces',serif;font-size:24px;font-weight:800;color:#fff}
.hdr p{color:var(--tx3);font-size:12px;margin-top:3px}
.card{background:var(--s1);border:1px solid rgba(255,255,255,.05);border-radius:14px;margin:0 12px 10px;padding:16px}
.btn{padding:12px 24px;border:none;border-radius:12px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s;-webkit-appearance:none}
.btn:active{transform:scale(.96)}
.bp{background:linear-gradient(135deg,#F06250,#FF8A6E);color:#fff}
.bs{background:var(--s2);color:var(--tx);border:1px solid rgba(255,255,255,.07)}
.ta{width:100%;padding:12px;border-radius:12px;background:var(--s2);color:var(--tx);font-size:14px;line-height:1.6;resize:vertical;border:1.5px solid rgba(255,255,255,.07);max-height:100px;min-height:40px}
.ta:focus{border-color:var(--accent)}
.ta::placeholder{color:var(--tx3)}
.shimmer{background:linear-gradient(90deg,var(--s2) 25%,#26264A 50%,var(--s2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:40px}
.toast{position:fixed;top:calc(16px + var(--st));left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:12px;background:var(--green);color:#0B0B14;font-size:12px;font-weight:700;z-index:1000}
.bubble{margin:8px 12px;padding:12px 14px;border-radius:12px;line-height:1.6;font-size:13px;animation:fadeUp .3s ease;word-wrap:break-word}
.bubble.user{background:var(--accent);color:#fff;margin-left:40px;text-align:right}
.bubble.ai{background:var(--s2);color:var(--tx);margin-right:40px}
.spinner{width:20px;height:20px;border:3px solid var(--tx3);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
.input-box{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,transparent,var(--bg));padding:12px 12px calc(12px + var(--sb));z-index:50}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-ta{flex:1;padding:10px 12px;border-radius:10px;background:var(--s1);border:1.5px solid rgba(255,255,255,.08);color:var(--tx);font-size:13px;resize:none;max-height:100px;min-height:40px}
.send-btn{padding:10px 12px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-weight:700;cursor:pointer;height:40px;min-width:40px;display:flex;align-items:center;justify-content:center}
.msgs-area{padding-bottom:120px}
</style>
</head>
<body>
<div class="content" id="content"></div>
<div class="toast" id="toast" style="display:none"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// ─── STATE ───
let state={
  page:"setup",profile:"",fileName:"",
  interviewType:"",messages:[],questionCount:0,maxQuestions:0
};

try{
  state.profile=localStorage.getItem("pm_profile")||"";
  state.fileName=localStorage.getItem("pm_filename")||"";
}catch(e){}

function save(){try{localStorage.setItem("pm_profile",state.profile);localStorage.setItem("pm_filename",state.fileName)}catch(e){}}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2500)}

// ─── AI CALL ───
async function callAI(userMsg){
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:400,
        system:`You are an expert PM interviewer at a FAANG company. You conduct conversational, challenging interviews.
${state.profile?`Candidate background:\n${state.profile}\n`:""}
INTERVIEW STYLE:
- Ask ONE focused question at a time, natural tone
- LISTEN to their answer carefully
- Give IMMEDIATE feedback: 1 sentence on what was strong, 1 sentence on what was weak/missing
- Ask a follow-up if needed for clarity
- After ${state.maxQuestions} questions, summarize with a rating (Strong Hire / Hire / Lean Hire / Not Yet Ready)
- Reference their specific experience when you can
- Challenge them - don't be easy

Keep responses concise (2-3 sentences max per turn). Be the real interviewer they need.`,
        messages:state.messages.map(m=>({role:m.role,content:m.content}))
      })
    });
    const d=await r.json();
    return d.content?.[0]?.text||"Error. Try again.";
  }catch(e){return "Connection error. Check internet."}
}

// ─── PDF EXTRACTION ───
async function extractPDF(file){
  return new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    script.onload=async()=>{
      try{
        pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        const buf=await file.arrayBuffer();
        const pdf=await pdfjsLib.getDocument({data:buf}).promise;
        let text="";
        for(let i=1;i<=Math.min(pdf.numPages,2);i++){
          const pg=await pdf.getPage(i);
          const c=await pg.getTextContent();
          text+=c.items.map(x=>x.str).join(" ")+"\n";
        }
        resolve(text.trim());
      }catch(e){reject(e)}
    };
    script.onerror=()=>reject(new Error("PDF load failed"));
    document.head.appendChild(script);
  });
}

// ─── RENDER ───
function render(){
  const c=document.getElementById("content");
  c.scrollTop=0;
  if(state.page==="setup")renderSetup(c);
  else if(state.page==="profile")renderProfile(c);
  else if(state.page==="interview")renderInterview(c);
}

function renderSetup(c){
  c.innerHTML=`
  <div class="page active">
    <div class="hdr"><h1>🎯 Interactive PM Interview</h1><p>Conversational interview with live feedback</p></div>
    <div style="padding:16px 12px 100px">
      <div class="card">
        <h2 style="font-family:'Fraunces',serif;font-size:18px;margin-bottom:12px">Start interviewing</h2>
        <div style="color:var(--tx2);font-size:13px;line-height:1.7;margin-bottom:16px">
          ${state.profile
            ?`<div style="color:var(--green);font-weight:700;margin-bottom:8px">✓ Resume loaded (${state.profile.split(/\s+/).length} words)</div>You'll be interviewed conversationally. AI will ask questions, listen to your answers, and give real-time feedback.`
            :`<strong>First:</strong> Upload your resume for personalized interviewing based on your background.`}
        </div>
        <button class="btn bp" style="width:100%;margin-bottom:10px" onclick="state.page='profile';render()">
          ${state.profile?"Change Resume":"Upload Resume"}
        </button>
        ${state.profile?`
        <div style="font-size:12px;color:var(--tx3);margin:16px 0">Interview type:</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
          <button class="card" style="padding:14px;text-align:center;cursor:pointer;border:1px solid rgba(240,98,80,.2);transition:all .2s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='rgba(240,98,80,.2)'" onclick="start('behavioral')">
            <div style="font-size:28px;margin-bottom:4px">🧠</div>
            <div style="font-size:12px;font-weight:700">Behavioral</div>
            <div style="font-size:10px;color:var(--tx3);margin-top:4px">3 questions</div>
          </button>
          <button class="card" style="padding:14px;text-align:center;cursor:pointer;border:1px solid rgba(240,98,80,.2);transition:all .2s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='rgba(240,98,80,.2)'" onclick="start('strategy')">
            <div style="font-size:28px;margin-bottom:4px">♟️</div>
            <div style="font-size:12px;font-weight:700">Strategy</div>
            <div style="font-size:10px;color:var(--tx3);margin-top:4px">3 questions</div>
          </button>
          <button class="card" style="padding:14px;text-align:center;cursor:pointer;border:1px solid rgba(240,98,80,.2);transition:all .2s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='rgba(240,98,80,.2)'" onclick="start('mixed')">
            <div style="font-size:28px;margin-bottom:4px">🎯</div>
            <div style="font-size:12px;font-weight:700">Mixed</div>
            <div style="font-size:10px;color:var(--tx3);margin-top:4px">5 questions</div>
          </button>
          <button class="card" style="padding:14px;text-align:center;cursor:pointer;border:1px solid rgba(240,98,80,.2);transition:all .2s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='rgba(240,98,80,.2)'" onclick="state.page='practice';render()">
            <div style="font-size:28px;margin-bottom:4px">📚</div>
            <div style="font-size:12px;font-weight:700">Q Library</div>
            <div style="font-size:10px;color:var(--tx3);margin-top:4px">Practice</div>
          </button>
        </div>
        <div style="font-size:11px;color:var(--tx3);padding:12px;background:rgba(255,255,255,.02);border-radius:10px">
          💡 The AI interviewer will ask follow-up questions based on your answers. Answer naturally - don't worry about perfect structure.
        </div>
        `:""}
      </div>
    </div>
  </div>`;
}

function renderProfile(c){
  c.innerHTML=`
  <div class="page active">
    <div class="hdr"><h1>👤 Your Resume</h1><p>Upload for personalized interview</p></div>
    <div style="padding:16px 12px 100px">
      <div class="card">
        <input type="file" accept=".pdf,.txt" id="filein" style="display:none"/>
        <div id="upzone" style="border:2px dashed rgba(255,255,255,.15);border-radius:16px;padding:32px 20px;text-align:center;cursor:pointer;background:rgba(255,255,255,.02);margin-bottom:16px" onclick="document.getElementById('filein').click()">
          <div id="upstatus">
            ${state.profile
              ?`<div style="font-size:36px;margin-bottom:8px">✅</div><div style="color:var(--green);font-weight:700">Loaded</div><div style="color:var(--tx2);font-size:11px;margin-top:4px">${state.fileName||"Pasted text"}</div>`
              :`<div style="font-size:36px;margin-bottom:8px">📄</div><div style="font-weight:700;margin-bottom:4px">Upload Your Resume</div><div style="color:var(--tx2);font-size:12px">PDF or text file</div>`}
          </div>
        </div>
        <textarea class="ta" id="profta" style="min-height:220px;max-height:none" placeholder="Or paste your resume/experience here...">${state.profile}</textarea>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn bp" style="flex:1" onclick="savePro()">💾 Save</button>
          <button class="btn bs" onclick="state.page='setup';render()">← Back</button>
        </div>
      </div>
    </div>
  </div>`;

  document.getElementById("filein").onchange=async(e)=>{
    const f=e.target.files?.[0];if(!f)return;
    document.getElementById("upstatus").innerHTML=`<div class="spinner"></div><div style="color:var(--tx2);margin-top:8px;font-size:12px">Reading...</div>`;
    try{
      if(f.name.toLowerCase().endsWith(".pdf"))state.profile=await extractPDF(f);
      else state.profile=await f.text();
      state.fileName=f.name;save();toast("✓ Uploaded!");renderProfile(c);
    }catch(e){toast("Error reading file");renderProfile(c)}
  };
  document.getElementById("profta").oninput=(e)=>{state.profile=e.target.value;state.fileName=""};
}

function renderInterview(c){
  c.innerHTML=`
  <div class="page active" style="padding-bottom:140px;min-height:100vh">
    <div style="padding:16px 12px 0;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="font-family:'Fraunces',serif;font-size:18px">🎙️ Interview</h2>
      <button class="bs" style="padding:6px 12px;font-size:12px;border-radius:8px" onclick="endInterview()">End</button>
    </div>
    <div class="msgs-area" id="msgs"></div>
  </div>
  <div class="input-box">
    <div class="input-row">
      <textarea class="input-ta" id="userin" placeholder="Type your answer..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button class="send-btn" onclick="send()">→</button>
    </div>
  </div>`;

  const msgBox=document.getElementById("msgs");
  state.messages.forEach(m=>{
    const b=document.createElement("div");
    b.className="bubble"+(m.role==="user"?" user":" ai");
    b.textContent=m.content;
    msgBox.appendChild(b);
  });

  setTimeout(()=>{msgBox.parentElement.scrollTop=msgBox.parentElement.scrollHeight},100);

  const inp=document.getElementById("userin");
  inp.focus();
}

async function send(){
  const inp=document.getElementById("userin");
  const ans=inp.value.trim();
  if(!ans)return;

  state.messages.push({role:"user",content:ans});
  inp.value="";

  const msgBox=document.getElementById("msgs");
  const b1=document.createElement("div");
  b1.className="bubble user";
  b1.textContent=ans;
  msgBox.appendChild(b1);

  const b2=document.createElement("div");
  b2.className="bubble ai";
  b2.innerHTML=`<div class="spinner"></div>`;
  msgBox.appendChild(b2);

  msgBox.parentElement.scrollTop=msgBox.parentElement.scrollHeight;

  const response=await callAI(ans);
  state.messages.push({role:"assistant",content:response});
  state.questionCount++;

  b2.textContent=response;
  msgBox.parentElement.scrollTop=msgBox.parentElement.scrollHeight;

  if(state.questionCount>=state.maxQuestions){
    setTimeout(()=>{
      const b3=document.createElement("div");
      b3.className="bubble ai";
      b3.innerHTML=`<strong>Interview Complete</strong><br><br>Tap "End" to review or start a new interview.`;
      msgBox.appendChild(b3);
      msgBox.parentElement.scrollTop=msgBox.parentElement.scrollHeight;
    },1000);
  }

  inp.focus();
}

async function start(type){
  state.interviewType=type;
  state.maxQuestions=type==="mixed"?5:3;
  state.questionCount=0;
  state.messages=[];
  state.page="interview";

  const prompts={
    behavioral:"Start a PM interview. Ask your first behavioral question about a real challenge or conflict they faced. Make it specific to their role.",
    strategy:"Start a PM interview. Ask your first strategy question - something about product vision, roadmap, or company direction.",
    mixed:"Start a comprehensive PM interview. Ask your first question - could be behavioral or strategic."
  };

  state.messages.push({role:"user",content:prompts[type]});
  const resp=await callAI(prompts[type]);
  state.messages.push({role:"assistant",content:resp});
  state.questionCount=1;

  render();
  setTimeout(()=>{
    const msgsDiv=document.getElementById("msgs");
    if(msgsDiv)msgsDiv.parentElement.scrollTop=msgsDiv.parentElement.scrollHeight;
  },100);
}

function savePro(){
  state.profile=document.getElementById("profta").value;
  save();toast("✓ Saved!");
}

function endInterview(){
  state.page="setup";
  render();
  toast("Interview ended");
}

// Init
render();
</script>
</body>
</html>
